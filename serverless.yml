service: agora-letiende

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  httpApi:
    cors: true
    # GAP DOCUMENTADO A PROPÓSITO, no silenciado (TODO.md Tarea 2,
    # CLAUDE.md §5 A07: "la creación de compras es la superficie más barata
    # de abusar de toda la aplicación"): `POST /api/compras` NO tiene
    # límite de tasa todavía. Se investigó `provider.httpApi.throttle`
    # (nativo de Serverless Framework para REST API vía `usagePlan`, pero
    # NO existe para HTTP API — verificado, no asumido) y `routeSettings`
    # por ruta (requiere el plugin `serverless-apigateway-route-settings`,
    # no evaluado todavía contra Serverless Framework 4, o un
    # `resources.extensions` de CloudFormation a mano sobre el Stage
    # autogenerado, no verificable sin desplegar en este entorno). Cerrar
    # esto es la primera mejora de seguridad a agregar antes de tráfico
    # real — sin él, un script puede agotar el aforo de un evento con
    # reservas que nunca se pagan.
  deploymentBucket:
    # Sin este tope, cada despliegue deja su artefacto en S3 para siempre
    # (docs/advertencia-urgente-costos-aws.md §3). Se conservan 5, el resto
    # se borra en cada deploy.
    maxPreviousDeploymentArtifacts: 5
  # Nunca el default infinito de CloudWatch Logs — regla de mayor prioridad
  # de "Costos de infraestructura" en CLAUDE.md, derivada del incidente de
  # Babel documentado en docs/advertencia-urgente-costos-aws.md §3.
  logRetentionInDays: 14
  # Etiquetado obligatorio: la cuenta AWS es compartida con Babel y
  # Comandante; sin esto, Cost Explorer no puede separar el gasto de cada
  # app (CLAUDE.md, sección "Costos de infraestructura"; tech-specs.md §7.3).
  stackTags:
    Proyecto: agora
    Stage: ${sls:stage}
  tags:
    Proyecto: agora
    Stage: ${sls:stage}
  # Cada función define su propio rol de mínimo privilegio más abajo
  # (ver `resources.Resources.SaludLambdaRole` / `SsrLambdaRole`) — ver
  # CLAUDE.md §5 (A05: configuración de seguridad incorrecta).

package:
  individually: true

custom:
  nombresTablas:
    usuarios: agora-usuarios-${sls:stage}
    eventos: agora-eventos-${sls:stage}
    compras: agora-compras-${sls:stage}
    boletas: agora-boletas-${sls:stage}
    auditoria: agora-auditoria-${sls:stage}
  nombresBuckets:
    comprobantes: agora-comprobantes-${sls:stage}
    activos: agora-activos-${sls:stage}

functions:
  salud:
    handler: dist-server/api/handlers/salud.handler
    role: !GetAtt SaludLambdaRole.Arn
    description: >-
      GET /api/salud — verificación de despliegue, sin dependencias de
      DynamoDB (tech-specs.md §5.1, TODO.md Tarea 2).
    environment:
      STAGE: ${sls:stage}
      VERSION: ${file(package.json):version}
    package:
      patterns:
        - '!**'
        - 'dist-server/api/handlers/salud.js'
    events:
      - httpApi:
          path: /api/salud
          method: get

  usuariosMe:
    handler: dist-server-bundle/usuarios-me.handler
    role: !GetAtt UsuariosMeLambdaRole.Arn
    description: >-
      GET /api/usuarios/me — verifica el ID Token de Firebase y resuelve el
      rol contra agora-usuarios (tech-specs.md §8.1, TODO.md Tarea 1).
    environment:
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # firebase-admin tiene un árbol de dependencias transitivas profundo
      # y cambiante. Copiar a mano un subconjunto de `node_modules/**` en
      # este archivo (versión anterior de este bloque) dejó algo fuera sin
      # que ningún build local lo detectara — verificado en vivo en staging
      # (MEMORY.md §7): la Lambda fallaba en el arranque, antes de que
      # corriera el handler, incluso sin header `Authorization`. En su
      # lugar, `npm run bundle:api` (server/bundle-lambdas.mjs) empaqueta
      # esta función con esbuild en un único archivo autocontenido — el
      # propio resolvedor de módulos de esbuild encuentra todo lo que el
      # código realmente importa, igual que Node, así que no puede faltar
      # nada. Sin `node_modules/**` en el paquete: no hace falta.
      patterns:
        - '!**'
        - 'dist-server-bundle/usuarios-me.js'
    events:
      - httpApi:
          path: /api/usuarios/me
          method: get

  usuarios:
    handler: dist-server-bundle/usuarios.handler
    role: !GetAtt UsuariosLambdaRole.Arn
    description: >-
      CRUD de agora-usuarios (GET/POST /api/usuarios, PUT/DELETE
      /api/usuarios/:email), exclusivo de administrador (TODO.md Tarea 1).
    environment:
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # Mismo motivo que usuariosMe: depende de firebase-admin
      # transitivamente (vía lib/autorizacion.ts), así que se empaqueta con
      # esbuild (npm run bundle:api) en vez de copiar node_modules/** a mano.
      patterns:
        - '!**'
        - 'dist-server-bundle/usuarios.js'
    events:
      - httpApi:
          path: /api/usuarios
          method: get
      - httpApi:
          path: /api/usuarios
          method: post
      - httpApi:
          path: /api/usuarios/{email}
          method: put
      - httpApi:
          path: /api/usuarios/{email}
          method: delete

  eventos:
    handler: dist-server-bundle/eventos.handler
    role: !GetAtt EventosLambdaRole.Arn
    description: >-
      CRUD de agora-eventos, URL de carga de activos y QR de marketing
      (GET /api/eventos/:eventoId/qr), exclusivo de administrador
      (TODO.md Tarea 1).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      BUCKET_ACTIVOS: ${self:custom.nombresBuckets.activos}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # Mismo motivo que usuarios/usuariosMe: depende de firebase-admin
      # transitivamente (vía lib/autorizacion.ts), así que se empaqueta con
      # esbuild (npm run bundle:api) en vez de copiar node_modules/** a mano.
      patterns:
        - '!**'
        - 'dist-server-bundle/eventos.js'
    events:
      - httpApi:
          path: /api/eventos
          method: get
      - httpApi:
          path: /api/eventos
          method: post
      - httpApi:
          path: /api/eventos/{eventoId}
          method: put
      - httpApi:
          path: /api/eventos/{eventoId}
          method: delete
      - httpApi:
          path: /api/eventos/{eventoId}/activos/url-carga
          method: post
      - httpApi:
          path: /api/eventos/{eventoId}/qr
          method: get

  eventosPublicos:
    handler: dist-server-bundle/eventos-publicos.handler
    role: !GetAtt EventosPublicosLambdaRole.Arn
    description: >-
      Cartelera pública (GET /api/eventos-publicos,
      /api/eventos-publicos/{slug}, /sitemap.xml), sin autenticación
      (TODO.md Tarea 1).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      BUCKET_ACTIVOS: ${self:custom.nombresBuckets.activos}
    package:
      # No depende de firebase-admin (nunca usa exigirRol), pero SÍ de
      # documentoDynamoDB (@aws-sdk/lib-dynamodb) — suficiente para el mismo
      # fallo de arranque que ya documentó usuariosMe (MEMORY.md §7): un
      # 500 genérico de API Gateway porque el paquete no traía node_modules
      # y el runtime de Lambda no garantiza el SDK v3 preinstalado. Bug
      # real encontrado en staging tras el primer despliegue de esta
      # función — corregido empaquetando con esbuild, igual que
      # eventos/usuarios/usuariosMe (server/bundle-lambdas.mjs).
      patterns:
        - '!**'
        - 'dist-server-bundle/eventos-publicos.js'
    events:
      - httpApi:
          path: /api/eventos-publicos
          method: get
      - httpApi:
          path: /api/eventos-publicos/{slug}
          method: get
      - httpApi:
          path: /sitemap.xml
          method: get

  liberarReservas:
    handler: dist-server-bundle/liberar-reservas.handler
    role: !GetAtt LiberarReservasLambdaRole.Arn
    description: >-
      Consumidor de Streams de agora-compras: libera el aforo reservado
      cuando el TTL borra una reserva vencida (TODO.md Tarea 2).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
    package:
      # Depende de documentoDynamoDB y de @aws-sdk/util-dynamodb
      # (unmarshall) — mismo motivo de bundle que eventos-publicos.ts
      # (server/bundle-lambdas.mjs, MEMORY.md §7).
      patterns:
        - '!**'
        - 'dist-server-bundle/liberar-reservas.js'
    events:
      - stream:
          type: dynamodb
          arn: !GetAtt AgoraCompras.StreamArn
          batchSize: 10
          startingPosition: LATEST

  compras:
    handler: dist-server-bundle/compras.handler
    role: !GetAtt ComprasLambdaRole.Arn
    description: >-
      POST /api/compras, GET /api/compras/:compraId/estado — inicia una
      compra, reserva sillas y envía el enlace de comprobante. Público, sin
      exigirRol (TODO.md Tarea 2).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      TABLA_COMPRAS: ${self:custom.nombresTablas.compras}
      SES_REMITENTE: ${env:SES_REMITENTE, ''}
      URL_BASE_APP: ${env:URL_BASE_APP, ''}
      SECRETO_ENLACES_MAGICOS: ${env:SECRETO_ENLACES_MAGICOS, ''}
    package:
      # Depende de documentoDynamoDB y de @aws-sdk/client-ses — mismo
      # motivo de bundle que eventos-publicos.ts/liberar-reservas.ts
      # (server/bundle-lambdas.mjs, MEMORY.md §7).
      patterns:
        - '!**'
        - 'dist-server-bundle/compras.js'
    events:
      - httpApi:
          path: /api/compras
          method: post
      - httpApi:
          path: /api/compras/{compraId}/estado
          method: get

  comprobantes:
    handler: dist-server-bundle/comprobantes.handler
    role: !GetAtt ComprobantesLambdaRole.Arn
    description: >-
      POST /api/comprobantes/:token/url-carga y /confirmar — carga del
      comprobante de pago vía enlace mágico, sin exigirRol (TODO.md
      Tarea 2).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      TABLA_COMPRAS: ${self:custom.nombresTablas.compras}
      BUCKET_COMPROBANTES: ${self:custom.nombresBuckets.comprobantes}
      SES_REMITENTE: ${env:SES_REMITENTE, ''}
      # Necesaria desde TODO.md Tarea 2 (Aprobación del productor):
      # confirmarComprobante() ahora arma la URL del enlace de aprobación
      # que le llega al productor por correo. Agregada de una vez en este
      # mismo cambio, no como fix posterior — mismo gotcha ya sufrido con
      # SES_REMITENTE/SECRETO_ENLACES_MAGICOS en compras (MEMORY.md §7).
      URL_BASE_APP: ${env:URL_BASE_APP, ''}
      SECRETO_ENLACES_MAGICOS: ${env:SECRETO_ENLACES_MAGICOS, ''}
    package:
      # Depende de documentoDynamoDB y de @aws-sdk/client-ses — mismo
      # motivo de bundle que compras.ts (server/bundle-lambdas.mjs).
      patterns:
        - '!**'
        - 'dist-server-bundle/comprobantes.js'
    events:
      - httpApi:
          path: /api/comprobantes/{token}/url-carga
          method: post
      - httpApi:
          path: /api/comprobantes/{token}/confirmar
          method: post

  aprobaciones:
    handler: dist-server-bundle/aprobaciones.handler
    role: !GetAtt AprobacionesLambdaRole.Arn
    description: >-
      GET /api/aprobaciones (productor), GET/POST /api/aprobaciones/:token
      (enlace mágico) — revisión, aprobación y rechazo de compras
      en_revision (TODO.md Tarea 2).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      TABLA_COMPRAS: ${self:custom.nombresTablas.compras}
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      TABLA_BOLETAS: ${self:custom.nombresTablas.boletas}
      BUCKET_COMPROBANTES: ${self:custom.nombresBuckets.comprobantes}
      SES_REMITENTE: ${env:SES_REMITENTE, ''}
      # Necesarias desde TODO.md Tarea 2 (Emisión de boletas): aprobarCompra()
      # ahora arma la URL firmada de cada boleta emitida para el correo al
      # cliente. Agregadas de una vez en este mismo cambio, no como fix
      # posterior — mismo gotcha ya sufrido dos veces (MEMORY.md §7).
      URL_BASE_APP: ${env:URL_BASE_APP, ''}
      SECRETO_FIRMA_BOLETAS: ${env:SECRETO_FIRMA_BOLETAS, ''}
      SECRETO_ENLACES_MAGICOS: ${env:SECRETO_ENLACES_MAGICOS, ''}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # Depende de firebase-admin (vía exigirRol), documentoDynamoDB y
      # @aws-sdk/client-ses — mismo motivo de bundle que el resto.
      patterns:
        - '!**'
        - 'dist-server-bundle/aprobaciones.js'
    events:
      - httpApi:
          path: /api/aprobaciones
          method: get
      - httpApi:
          path: /api/aprobaciones/{token}
          method: get
      - httpApi:
          path: /api/aprobaciones/{token}/aprobar
          method: post
      - httpApi:
          path: /api/aprobaciones/{token}/rechazar
          method: post

  boletas:
    handler: dist-server-bundle/boletas.handler
    role: !GetAtt BoletasLambdaRole.Arn
    description: >-
      GET /api/boletas/:codigo (público) — muestra la boleta digital.
      POST /api/boletas/:codigo/validar (exigirRol portero) — valida el
      ingreso en puerta con los cuatro veredictos de tech-specs.md §5.5
      (TODO.md Tarea 2, Validación en puerta).
    environment:
      TABLA_BOLETAS: ${self:custom.nombresTablas.boletas}
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      TABLA_COMPRAS: ${self:custom.nombresTablas.compras}
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      BUCKET_ACTIVOS: ${self:custom.nombresBuckets.activos}
      URL_BASE_APP: ${env:URL_BASE_APP, ''}
      SECRETO_FIRMA_BOLETAS: ${env:SECRETO_FIRMA_BOLETAS, ''}
      # Necesaria desde TODO.md Tarea 2 (Validación en puerta): esta función
      # gana su primera dependencia de firebase-admin (vía exigirRol) — hasta
      # ahora era 100% pública. Agregada de una vez en este mismo cambio, no
      # como fix posterior (misma lección repetida varias veces, MEMORY.md §7).
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # Depende de documentoDynamoDB y, desde esta tarea, de firebase-admin
      # (vía exigirRol) — mismo motivo de bundle que aprobaciones.ts
      # (server/bundle-lambdas.mjs, MEMORY.md §7).
      patterns:
        - '!**'
        - 'dist-server-bundle/boletas.js'
    events:
      - httpApi:
          path: /api/boletas/{codigo}
          method: get
      - httpApi:
          path: /api/boletas/{codigo}/validar
          method: post

  ssr:
    handler: server/ssr/handler.handler
    role: !GetAtt SsrLambdaRole.Arn
    description: >-
      Renderizado SSR de Angular (todo lo que no sea /api/*, tech-specs.md
      §1). Sin permisos de DynamoDB: solo renderiza, no accede a datos.
    memorySize: 512
    environment:
      # Protección SSRF de Angular (`AngularNodeAppEngine`) exige una lista
      # explícita de hosts permitidos (MEMORY.md §7, gotcha verificado).
      # Sin dominio propio todavía (roadmap #17 en tech-specs.md §11):
      # solo el hostname crudo de API Gateway.
      NG_ALLOWED_HOSTS: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    package:
      patterns:
        - '!**'
        - 'dist/agora-letiende/**'
        - 'server/ssr/handler.mjs'
        - 'node_modules/@codegenie/serverless-express/**'
    events:
      - httpApi:
          path: /
          method: get
      - httpApi:
          path: /{proxy+}
          method: '*'

resources:
  Resources:
    # --- Roles IAM de mínimo privilegio (uno por función, CLAUDE.md §5 A05) ---
    SaludLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-salud-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Sin política de DynamoDB: /api/salud no toca ninguna tabla.

    UsuariosMeLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-usuarios-me-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo lectura puntual
          # (GetItem, no Query/Scan) sobre agora-usuarios, sin comodines de
          # Resource ni acceso a ninguna otra tabla.
          - PolicyName: agora-usuarios-me-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraUsuarios.Arn

    UsuariosLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-usuarios-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo las acciones que el
          # CRUD de usuarios.ts realmente usa, acotadas exclusivamente a
          # agora-usuarios, sin comodines de Resource ni acceso a otra tabla.
          - PolicyName: agora-usuarios-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    # GetItem: exigirRol() resuelve el permiso del propio
                    # solicitante (resolver-permisos.ts) antes de despachar.
                    - dynamodb:GetItem
                    - dynamodb:Scan
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource: !GetAtt AgoraUsuarios.Arn

    EventosLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-eventos-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo las acciones que
          # eventos.ts realmente usa, acotadas exclusivamente a
          # agora-eventos, sin comodines de Resource ni acceso a otra tabla.
          # GetItem: generarQrEvento() lee el slug real del evento — el QR
          # nunca codifica un slug recibido en la ruta o el payload (A08).
          - PolicyName: agora-eventos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Scan
                    - dynamodb:GetItem
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource: !GetAtt AgoraEventos.Arn
                - Effect: Allow
                  # GetItem, no Query/Scan: exigirRol() resuelve el permiso
                  # del propio solicitante (resolver-permisos.ts) contra
                  # agora-usuarios, sin acceso a ninguna otra acción de esa
                  # tabla desde esta función.
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraUsuarios.Arn
          # s3:PutObject/DeleteObject acotados al prefijo de activos de
          # eventos — nunca s3:* ni Resource: "*" (CLAUDE.md §5, A05/A10).
          # La URL prefirmada es lo único que permite escribir en el bucket;
          # el backend nunca descarga una URL arbitraria. DeleteObject es
          # para limpiar imagen/logotipo al eliminar un evento
          # (eliminarActivosDelEvento en eventos.ts); ListBucket es aparte
          # porque actúa sobre el bucket, no sobre un objeto — se acota con
          # una condición al mismo prefijo para que ni siquiera liste el
          # resto del bucket.
          - PolicyName: agora-eventos-s3-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:DeleteObject
                  Resource: !Sub '${BucketActivos.Arn}/eventos/*'
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !GetAtt BucketActivos.Arn
                  Condition:
                    StringLike:
                      s3:prefix: 'eventos/*'

    EventosPublicosLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-eventos-publicos-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo dynamodb:Query sobre
          # agora-eventos (tabla + GSIs, el sufijo /index/* es obligatorio o
          # Query sobre un GSI falla con AccessDenied) — sin Scan, sin
          # acceso a agora-usuarios, sin s3:* (las URLs de imagen se
          # calculan por convención de nombre, no requieren permiso S3: son
          # públicas por bucket policy, no prefirmadas).
          - PolicyName: agora-eventos-publicos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt AgoraEventos.Arn
                    - !Sub '${AgoraEventos.Arn}/index/*'

    LiberarReservasLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-liberar-reservas-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): esta Lambda nunca la
          # invoca un humano (dispara solo por Streams), así que no necesita
          # exigirRol ni acceso a agora-usuarios. Sobre agora-eventos, solo
          # dynamodb:UpdateItem — liberarSillas() nunca lee, solo escribe
          # condicionalmente (tech-specs.md §5.4 punto 3).
          - PolicyName: agora-liberar-reservas-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:UpdateItem
                  Resource: !GetAtt AgoraEventos.Arn
          # Permisos de lectura del propio Stream de agora-compras — no dan
          # acceso a los ítems de la tabla (ni Query ni Scan ni GetItem
          # aquí), solo a leer los registros de cambio que el trigger ya
          # entrega como payload. dynamodb:ListStreams no admite permisos a
          # nivel de recurso (documentación de IAM de DynamoDB): Resource
          # debe ser "*" para esa acción específica, no es un comodín
          # evitable.
          - PolicyName: agora-liberar-reservas-streams-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:DescribeStream
                    - dynamodb:GetRecords
                    - dynamodb:GetShardIterator
                  Resource: !GetAtt AgoraCompras.StreamArn
                - Effect: Allow
                  Action:
                    - dynamodb:ListStreams
                  Resource: '*'

    ComprasLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-compras-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): compras.ts nunca usa
          # exigirRol (endpoint público), así que sin acceso a
          # agora-usuarios. Sobre agora-eventos: Query (resolver el slug por
          # su GSI, nunca Scan), GetItem (clasificarFalloReserva en
          # aforo.ts, solo después de que una reserva ya falló) y
          # UpdateItem (reservarSillas).
          - PolicyName: agora-compras-eventos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt AgoraEventos.Arn
                    - !Sub '${AgoraEventos.Arn}/index/*'
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt AgoraEventos.Arn
          # Sobre agora-compras: PutItem para crear la compra, GetItem para
          # el endpoint de estado — sin Scan ni Query, esta función nunca
          # lista compras.
          - PolicyName: agora-compras-compras-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraCompras.Arn
          # ses:SendEmail (no ses:*), acotado a la identidad verificada de
          # letiende.co — el enlace de comprobante es el único correo que
          # esta función envía (services/notificaciones.ts).
          - PolicyName: agora-compras-ses-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ses:SendEmail
                    - ses:SendRawEmail
                  Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/letiende.co'

    ComprobantesLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-comprobantes-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): comprobantes.ts nunca usa
          # exigirRol (el token del enlace mágico es la única credencial),
          # sin acceso a agora-usuarios. Sobre agora-compras: Query acotado
          # al GSI de token (validarToken), UpdateItem condicional (guardar
          # la key subida y transicionar a en_revision) — sin PutItem, esta
          # función nunca crea compras, solo las actualiza.
          - PolicyName: agora-comprobantes-compras-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt AgoraCompras.Arn
                    - !Sub '${AgoraCompras.Arn}/index/*'
                - Effect: Allow
                  Action:
                    - dynamodb:UpdateItem
                  Resource: !GetAtt AgoraCompras.Arn
          # GetItem sobre agora-eventos: resolver el nombre y los
          # productores del evento para la notificación de comprobante
          # cargado — sin Query ni Scan, esta función nunca lista eventos.
          - PolicyName: agora-comprobantes-eventos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraEventos.Arn
          # S3 acotado al prefijo compras/* de BucketComprobantes: PutObject
          # (URL prefirmada de subida), GetObject (verificar magic bytes),
          # DeleteObject (limpiar un archivo que no pasó la verificación).
          - PolicyName: agora-comprobantes-s3-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:GetObject
                    - s3:DeleteObject
                  Resource: !Sub '${BucketComprobantes.Arn}/compras/*'
          # ses:SendEmail (no ses:*), acotado a la identidad verificada de
          # letiende.co — el aviso de comprobante por revisar es el único
          # correo que esta función envía.
          - PolicyName: agora-comprobantes-ses-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ses:SendEmail
                    - ses:SendRawEmail
                  Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/letiende.co'

    AprobacionesLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-aprobaciones-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # GetItem sobre agora-usuarios: exigirRol() resuelve el rol del
          # propio solicitante para GET /api/aprobaciones — mismo patrón
          # exacto que usuarios.ts/eventos.ts, sin Query/Scan/otra acción.
          - PolicyName: agora-aprobaciones-usuarios-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraUsuarios.Arn
          # Sobre agora-eventos: Scan (resolver qué eventos tienen a este
          # productor en `productores` — sin GSI para "contiene" un
          # elemento de array, mismo criterio ya aceptado en eventos.ts
          # para listados de bajo volumen) + GetItem (nombre del evento al
          # rechazar y al notificar comprobante) + UpdateItem
          # (confirmarSillas/liberarSillas de aforo.ts, que esta función
          # invoca desde aprobar/rechazar — sin este permiso, la escritura
          # condicional sobre agora-eventos falla con AccessDeniedException,
          # no con ConditionalCheckFailedException, así que no la clasifica
          # ErrorAforo y termina como 500 genérico: bug real encontrado en
          # staging, ver MEMORY.md §7).
          - PolicyName: agora-aprobaciones-eventos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Scan
                    - dynamodb:GetItem
                    - dynamodb:UpdateItem
                  Resource: !GetAtt AgoraEventos.Arn
          # Sobre agora-compras: Query acotado a los dos GSIs que esta
          # función usa (eventoId-creadaEn-index para el listado,
          # tokenAprobacionHash-index para validar el enlace) +
          # UpdateItem condicional (aprobar/rechazar) — sin PutItem, esta
          # función nunca crea compras.
          - PolicyName: agora-aprobaciones-compras-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt AgoraCompras.Arn
                    - !Sub '${AgoraCompras.Arn}/index/*'
                - Effect: Allow
                  Action:
                    - dynamodb:UpdateItem
                  Resource: !GetAtt AgoraCompras.Arn
          # S3 acotado al prefijo compras/*: solo GetObject, para mostrarle
          # el comprobante ya subido al productor — esta función nunca
          # sube ni borra objetos.
          - PolicyName: agora-aprobaciones-s3-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: !Sub '${BucketComprobantes.Arn}/compras/*'
          # PutItem sobre agora-boletas: emitirBoletas() de boleteria.ts, que
          # aprobarCompra() invoca tras confirmar el aforo (TODO.md Tarea 2,
          # Emisión de boletas). Sin ConditionExpression attribute_not_exists
          # que requiera otra acción — solo escribe boletas nuevas.
          - PolicyName: agora-aprobaciones-boletas-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:PutItem
                  Resource: !GetAtt AgoraBoletas.Arn
          # ses:SendEmail (no ses:*), acotado a la identidad verificada de
          # letiende.co — la notificación de compra rechazada y la de
          # boletas emitidas son los únicos correos que esta función envía.
          - PolicyName: agora-aprobaciones-ses-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ses:SendEmail
                    - ses:SendRawEmail
                  Resource: !Sub 'arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/letiende.co'

    BoletasLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-boletas-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # GetItem sobre agora-boletas/eventos/compras: GET /api/boletas/:codigo
          # (público) lee las tres. UpdateItem sobre agora-boletas:
          # POST /api/boletas/:codigo/validar (TODO.md Tarea 2, Validación en
          # puerta) — la única escritura condicional del ingreso en puerta.
          # Sin permisos de S3: el logotipo del evento se construye como URL
          # pública (mismo criterio que eventos-publicos.ts), nunca se firma
          # ni se lee.
          - PolicyName: agora-boletas-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource:
                    - !GetAtt AgoraBoletas.Arn
                    - !GetAtt AgoraEventos.Arn
                    - !GetAtt AgoraCompras.Arn
                - Effect: Allow
                  Action:
                    - dynamodb:UpdateItem
                  Resource: !GetAtt AgoraBoletas.Arn
          # GetItem sobre agora-usuarios: exigirRol('portero') resuelve el
          # rol del solicitante en POST /api/boletas/:codigo/validar — mismo
          # patrón exacto que aprobaciones.ts/eventos.ts, sin Query/Scan.
          - PolicyName: agora-boletas-usuarios-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraUsuarios.Arn

    SsrLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-ssr-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Sin política de DynamoDB: el SSR solo renderiza, no lee datos.

    # --- Tablas DynamoDB (tech-specs.md §5.2) ---
    # Todas PAY_PER_REQUEST, sin excepción, sin ProvisionedThroughput en
    # tabla ni GSI — regla de mayor prioridad de CLAUDE.md (sección "Costos
    # de infraestructura"), derivada del incidente real de Babel
    # (docs/advertencia-urgente-costos-aws.md: US$90,34 en un mes por
    # capacidad PROVISIONED olvidada, con las tablas de producción vacías).
    AgoraUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.usuarios}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH

    AgoraEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.eventos}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: eventoId
            AttributeType: S
          - AttributeName: slug
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: fechaHora
            AttributeType: S
        KeySchema:
          - AttributeName: eventoId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: slug-index
            KeySchema:
              - AttributeName: slug
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            # Sin ProvisionedThroughput: en PAY_PER_REQUEST el GSI hereda el
            # modo de la tabla; declararlo aquí hace fallar el despliegue.
          - IndexName: estado-fechaHora-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
              - AttributeName: fechaHora
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    AgoraCompras:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.compras}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: compraId
            AttributeType: S
          - AttributeName: eventoId
            AttributeType: S
          - AttributeName: creadaEn
            AttributeType: S
          - AttributeName: tokenAprobacionHash
            AttributeType: S
          - AttributeName: tokenComprobanteHash
            AttributeType: S
        KeySchema:
          - AttributeName: compraId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: eventoId-creadaEn-index
            KeySchema:
              - AttributeName: eventoId
                KeyType: HASH
              - AttributeName: creadaEn
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: tokenAprobacionHash-index
            KeySchema:
              - AttributeName: tokenAprobacionHash
                KeyType: HASH
            Projection:
              ProjectionType: ALL
          # Usado por handlers/compras.ts para generar el enlace de
          # comprobante (TODO.md Tarea 2) y, más adelante, por
          # handlers/comprobantes.ts (roadmap #10) para consumirlo. El hash
          # se deriva con server/api/lib/enlaces-magicos.ts — nunca se
          # guarda el token en claro (CLAUDE.md §5, A07).
          - IndexName: tokenComprobanteHash-index
            KeySchema:
              - AttributeName: tokenComprobanteHash
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # TTL: el reloj de limpieza y devolución de aforo, NO el reloj de
        # negocio — toda lectura debe tratar como expirada una reserva con
        # expiraEn pasado, exista o no todavía el ítem (tech-specs.md §5.4
        # punto 4, MEMORY.md §7).
        TimeToLiveSpecification:
          AttributeName: expiraEn
          Enabled: true
        # Streams: consumidos por la Lambda `liberarReservas` para devolver
        # el aforo cuando el TTL borra una reserva vencida.
        # NEW_AND_OLD_IMAGES porque el evento de borrado por TTL necesita la
        # imagen anterior para saber cuántas sillas devolver.
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    AgoraBoletas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.boletas}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: boletaId
            AttributeType: S
          - AttributeName: eventoId
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: compraId
            AttributeType: S
        KeySchema:
          - AttributeName: boletaId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: eventoId-estado-index
            KeySchema:
              - AttributeName: eventoId
                KeyType: HASH
              - AttributeName: estado
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: compraId-index
            KeySchema:
              - AttributeName: compraId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    AgoraAuditoria:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.auditoria}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: entidadId
            AttributeType: S
          - AttributeName: ocurridoEn
            AttributeType: S
        KeySchema:
          - AttributeName: entidadId
            KeyType: HASH
          - AttributeName: ocurridoEn
            KeyType: RANGE
        # Append-only (CLAUDE.md §5, A09): ningún código actualiza ni borra
        # ítems de esta tabla, nunca al corregir un error.

    # --- Buckets S3 (tech-specs.md §5, §7.1; CLAUDE.md §5 A02) ---
    BucketComprobantes:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.nombresBuckets.comprobantes}
        # Comprobantes de pago: documentos financieros de terceros. Block
        # Public Access sin excepción — se sirven solo por URL prefirmada
        # de vida corta generada por la Lambda (CLAUDE.md §5, A02).
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # Sin esto, la subida directa del navegador con la URL prefirmada
        # (comprobantes.ts, generarUrlCargaComprobante) falla en el
        # preflight (OPTIONS) del propio navegador antes de llegar a S3 —
        # mismo gotcha ya resuelto para BucketActivos (MEMORY.md §7).
        # `AllowedOrigins: '*'` es aceptable por el mismo motivo que ahí:
        # la autorización real la da la firma de la URL prefirmada, no el
        # origen — el bucket sigue privado (Block Public Access arriba).
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              MaxAge: 3000

    BucketActivos:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.nombresBuckets.activos}
        # Imágenes de evento y QR: en el diseño final se sirven "vía CDN"
        # (tech-specs.md §1), pero el CDN (CloudFront + dominio propio)
        # todavía no existe (roadmap #17). Excepción deliberada tomada para
        # la Tarea 1 (Cartelera pública): BlockPublicPolicy/RestrictPublicBuckets
        # en false para permitir la BucketPolicy pública de abajo, acotada
        # solo al prefijo `eventos/*` — las imágenes de evento necesitan una
        # URL estable (no una prefirmada de 15 minutos) para servir como
        # `og:image` y sobrevivir a la vista previa cacheada por WhatsApp.
        # BlockPublicAcls/IgnorePublicAcls siguen en true: seguimos sin usar
        # ACLs, solo una bucket policy. El resto del bucket (comprobantes no
        # viven aquí, pero cualquier otro prefijo futuro) sigue privado por
        # defecto. Esto se revisará cuando exista CloudFront/OAC (roadmap #17).
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: false
          IgnorePublicAcls: true
          RestrictPublicBuckets: false
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # Sin esto, la subida directa del navegador con la URL prefirmada
        # (server/api/handlers/eventos.ts, generarUrlCargaActivo) falla en
        # el preflight (OPTIONS) del propio navegador antes de llegar a S3
        # — bug real encontrado en staging (MEMORY.md §7): cualquier imagen
        # fallaba al subir, sin relación con su tamaño o formato.
        # `AllowedOrigins: '*'` es aceptable aquí porque CORS solo controla
        # qué origen puede *leer la respuesta* de la petición desde el
        # navegador; la autorización real de la escritura la da la firma de
        # la URL prefirmada (de vida corta, ligada a una key exacta), no el
        # origen — mismo motivo por el que no hace falta acotarlo a un
        # dominio fijo que además cambiaría con cada stage.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              MaxAge: 3000

    # Excepción deliberada tomada para la Tarea 1 (Cartelera pública),
    # distinta del resto de BucketActivos que sigue privado: lectura pública
    # de solo lectura (s3:GetObject) acotada estrictamente al prefijo
    # `eventos/*`, para que imagenUrl/logotipoUrl (calculadas en
    # eventos-publicos.ts) sirvan como og:image con una URL estable — no una
    # prefirmada de 15 minutos, que rompería la vista previa cacheada por
    # WhatsApp. Se revisará cuando exista CloudFront/OAC (roadmap #17).
    BucketActivosPolicyPublica:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BucketActivos
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${BucketActivos.Arn}/eventos/*'

  Outputs:
    # Fuente confiable de la URL del endpoint para el smoke test de CI
    # (.github/workflows/deploy.yml) — evita parsear el texto de salida de
    # `serverless deploy`, que en Serverless Framework 4 no siempre llega
    # por stdout (gotcha real: el primer despliegue de esta infraestructura
    # rompió el smoke test porque el paso de CI solo capturaba stdout con
    # `tee`, y el resumen de endpoints salió por stderr — MEMORY.md §7).
    HttpApiUrl:
      Description: URL base del endpoint de API Gateway (HTTP API)
      # Fn::Join en vez de !Sub: el resolvedor de variables ${...} de
      # Serverless Framework intenta resolver ${HttpApi}/${AWS::Region}
      # ANTES de que CloudFormation vea el Fn::Sub, y el resultado quedó
      # como un Value con Fn::Join y Fn::Sub mezclados en el mismo mapa —
      # inválido para CloudFormation ("must evaluate to a String and not
      # a Map"), y rompió el primer despliegue real de este Output
      # (MEMORY.md §7). Fn::Join con !Ref no contiene ningún `${...}`, así
      # que el resolvedor de Serverless no lo toca.
      #
      # AWS::URLSuffix explícito, no el literal '.amazonaws.com': Serverless
      # Framework reescribe automáticamente cualquier Fn::Join que reconoce
      # como URL de API Gateway para usar el pseudo-parámetro dinámico, y
      # si ya hay un '.amazonaws.com' literal en la lista, el suyo se
      # AGREGA en vez de reemplazarlo — el segundo intento de este Output
      # produjo 'amazonaws.comamazonaws.com' duplicado. Referenciarlo aquí
      # explícitamente evita que Serverless "corrija" nada.
      Value:
        Fn::Join:
