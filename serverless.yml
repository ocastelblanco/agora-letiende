service: agora-letiende

frameworkVersion: '4'

provider:
  name: aws
  runtime: nodejs24.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 10
  httpApi:
    cors: true
  deploymentBucket:
    # Sin este tope, cada despliegue deja su artefacto en S3 para siempre
    # (docs/advertencia-urgente-costos-aws.md §3). Se conservan 5, el resto
    # se borra en cada deploy.
    maxPreviousDeploymentArtifacts: 5
  # Nunca el default infinito de CloudWatch Logs — regla de mayor prioridad
  # de "Costos de infraestructura" en CLAUDE.md, derivada del incidente de
  # Babel documentado en docs/advertencia-urgente-costos-aws.md §3.
  logRetentionInDays: 14
  # Etiquetado obligatorio: la cuenta AWS es compartida con Babel y
  # Comandante; sin esto, Cost Explorer no puede separar el gasto de cada
  # app (CLAUDE.md, sección "Costos de infraestructura"; tech-specs.md §7.3).
  stackTags:
    Proyecto: agora
    Stage: ${sls:stage}
  tags:
    Proyecto: agora
    Stage: ${sls:stage}
  # Cada función define su propio rol de mínimo privilegio más abajo
  # (ver `resources.Resources.SaludLambdaRole` / `SsrLambdaRole`) — ver
  # CLAUDE.md §5 (A05: configuración de seguridad incorrecta).

package:
  individually: true

custom:
  nombresTablas:
    usuarios: agora-usuarios-${sls:stage}
    eventos: agora-eventos-${sls:stage}
    compras: agora-compras-${sls:stage}
    boletas: agora-boletas-${sls:stage}
    auditoria: agora-auditoria-${sls:stage}
  nombresBuckets:
    comprobantes: agora-comprobantes-${sls:stage}
    activos: agora-activos-${sls:stage}

functions:
  salud:
    handler: dist-server/api/handlers/salud.handler
    role: !GetAtt SaludLambdaRole.Arn
    description: >-
      GET /api/salud — verificación de despliegue, sin dependencias de
      DynamoDB (tech-specs.md §5.1, TODO.md Tarea 2).
    environment:
      STAGE: ${sls:stage}
      VERSION: ${file(package.json):version}
    package:
      patterns:
        - '!**'
        - 'dist-server/api/handlers/salud.js'
    events:
      - httpApi:
          path: /api/salud
          method: get

  usuariosMe:
    handler: dist-server-bundle/usuarios-me.handler
    role: !GetAtt UsuariosMeLambdaRole.Arn
    description: >-
      GET /api/usuarios/me — verifica el ID Token de Firebase y resuelve el
      rol contra agora-usuarios (tech-specs.md §8.1, TODO.md Tarea 1).
    environment:
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # firebase-admin tiene un árbol de dependencias transitivas profundo
      # y cambiante. Copiar a mano un subconjunto de `node_modules/**` en
      # este archivo (versión anterior de este bloque) dejó algo fuera sin
      # que ningún build local lo detectara — verificado en vivo en staging
      # (MEMORY.md §7): la Lambda fallaba en el arranque, antes de que
      # corriera el handler, incluso sin header `Authorization`. En su
      # lugar, `npm run bundle:api` (server/bundle-lambdas.mjs) empaqueta
      # esta función con esbuild en un único archivo autocontenido — el
      # propio resolvedor de módulos de esbuild encuentra todo lo que el
      # código realmente importa, igual que Node, así que no puede faltar
      # nada. Sin `node_modules/**` en el paquete: no hace falta.
      patterns:
        - '!**'
        - 'dist-server-bundle/usuarios-me.js'
    events:
      - httpApi:
          path: /api/usuarios/me
          method: get

  usuarios:
    handler: dist-server-bundle/usuarios.handler
    role: !GetAtt UsuariosLambdaRole.Arn
    description: >-
      CRUD de agora-usuarios (GET/POST /api/usuarios, PUT/DELETE
      /api/usuarios/:email), exclusivo de administrador (TODO.md Tarea 1).
    environment:
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # Mismo motivo que usuariosMe: depende de firebase-admin
      # transitivamente (vía lib/autorizacion.ts), así que se empaqueta con
      # esbuild (npm run bundle:api) en vez de copiar node_modules/** a mano.
      patterns:
        - '!**'
        - 'dist-server-bundle/usuarios.js'
    events:
      - httpApi:
          path: /api/usuarios
          method: get
      - httpApi:
          path: /api/usuarios
          method: post
      - httpApi:
          path: /api/usuarios/{email}
          method: put
      - httpApi:
          path: /api/usuarios/{email}
          method: delete

  eventos:
    handler: dist-server-bundle/eventos.handler
    role: !GetAtt EventosLambdaRole.Arn
    description: >-
      CRUD de agora-eventos (GET/POST /api/eventos, PUT/DELETE
      /api/eventos/:eventoId, POST
      /api/eventos/:eventoId/activos/url-carga), exclusivo de administrador
      (TODO.md Tarea 1).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      TABLA_USUARIOS: ${self:custom.nombresTablas.usuarios}
      BUCKET_ACTIVOS: ${self:custom.nombresBuckets.activos}
      FIREBASE_SERVICE_ACCOUNT_AGORA: ${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}
    package:
      # Mismo motivo que usuarios/usuariosMe: depende de firebase-admin
      # transitivamente (vía lib/autorizacion.ts), así que se empaqueta con
      # esbuild (npm run bundle:api) en vez de copiar node_modules/** a mano.
      patterns:
        - '!**'
        - 'dist-server-bundle/eventos.js'
    events:
      - httpApi:
          path: /api/eventos
          method: get
      - httpApi:
          path: /api/eventos
          method: post
      - httpApi:
          path: /api/eventos/{eventoId}
          method: put
      - httpApi:
          path: /api/eventos/{eventoId}
          method: delete
      - httpApi:
          path: /api/eventos/{eventoId}/activos/url-carga
          method: post

  eventosPublicos:
    handler: dist-server/api/handlers/eventos-publicos.handler
    role: !GetAtt EventosPublicosLambdaRole.Arn
    description: >-
      Cartelera pública (GET /api/eventos-publicos,
      /api/eventos-publicos/{slug}, /sitemap.xml), sin autenticación
      (TODO.md Tarea 1).
    environment:
      TABLA_EVENTOS: ${self:custom.nombresTablas.eventos}
      BUCKET_ACTIVOS: ${self:custom.nombresBuckets.activos}
    package:
      # A diferencia de eventos/usuarios/usuariosMe, no depende de
      # firebase-admin (nunca usa exigirRol) — empaquetado simple, igual que
      # salud, sin bundle de esbuild.
      patterns:
        - '!**'
        - 'dist-server/api/handlers/eventos-publicos.js'
    events:
      - httpApi:
          path: /api/eventos-publicos
          method: get
      - httpApi:
          path: /api/eventos-publicos/{slug}
          method: get
      - httpApi:
          path: /sitemap.xml
          method: get

  ssr:
    handler: server/ssr/handler.handler
    role: !GetAtt SsrLambdaRole.Arn
    description: >-
      Renderizado SSR de Angular (todo lo que no sea /api/*, tech-specs.md
      §1). Sin permisos de DynamoDB: solo renderiza, no accede a datos.
    memorySize: 512
    environment:
      # Protección SSRF de Angular (`AngularNodeAppEngine`) exige una lista
      # explícita de hosts permitidos (MEMORY.md §7, gotcha verificado).
      # Sin dominio propio todavía (roadmap #17 en tech-specs.md §11):
      # solo el hostname crudo de API Gateway.
      NG_ALLOWED_HOSTS: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
    package:
      patterns:
        - '!**'
        - 'dist/agora-letiende/**'
        - 'server/ssr/handler.mjs'
        - 'node_modules/@codegenie/serverless-express/**'
    events:
      - httpApi:
          path: /
          method: get
      - httpApi:
          path: /{proxy+}
          method: '*'

resources:
  Resources:
    # --- Roles IAM de mínimo privilegio (uno por función, CLAUDE.md §5 A05) ---
    SaludLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-salud-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Sin política de DynamoDB: /api/salud no toca ninguna tabla.

    UsuariosMeLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-usuarios-me-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo lectura puntual
          # (GetItem, no Query/Scan) sobre agora-usuarios, sin comodines de
          # Resource ni acceso a ninguna otra tabla.
          - PolicyName: agora-usuarios-me-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraUsuarios.Arn

    UsuariosLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-usuarios-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo las acciones que el
          # CRUD de usuarios.ts realmente usa, acotadas exclusivamente a
          # agora-usuarios, sin comodines de Resource ni acceso a otra tabla.
          - PolicyName: agora-usuarios-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    # GetItem: exigirRol() resuelve el permiso del propio
                    # solicitante (resolver-permisos.ts) antes de despachar.
                    - dynamodb:GetItem
                    - dynamodb:Scan
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource: !GetAtt AgoraUsuarios.Arn

    EventosLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-eventos-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo las acciones que
          # eventos.ts realmente usa, acotadas exclusivamente a
          # agora-eventos, sin comodines de Resource ni acceso a otra tabla.
          - PolicyName: agora-eventos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Scan
                    - dynamodb:PutItem
                    - dynamodb:UpdateItem
                    - dynamodb:DeleteItem
                  Resource: !GetAtt AgoraEventos.Arn
                - Effect: Allow
                  # GetItem, no Query/Scan: exigirRol() resuelve el permiso
                  # del propio solicitante (resolver-permisos.ts) contra
                  # agora-usuarios, sin acceso a ninguna otra acción de esa
                  # tabla desde esta función.
                  Action:
                    - dynamodb:GetItem
                  Resource: !GetAtt AgoraUsuarios.Arn
          # s3:PutObject/DeleteObject acotados al prefijo de activos de
          # eventos — nunca s3:* ni Resource: "*" (CLAUDE.md §5, A05/A10).
          # La URL prefirmada es lo único que permite escribir en el bucket;
          # el backend nunca descarga una URL arbitraria. DeleteObject es
          # para limpiar imagen/logotipo al eliminar un evento
          # (eliminarActivosDelEvento en eventos.ts); ListBucket es aparte
          # porque actúa sobre el bucket, no sobre un objeto — se acota con
          # una condición al mismo prefijo para que ni siquiera liste el
          # resto del bucket.
          - PolicyName: agora-eventos-s3-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:PutObject
                    - s3:DeleteObject
                  Resource: !Sub '${BucketActivos.Arn}/eventos/*'
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !GetAtt BucketActivos.Arn
                  Condition:
                    StringLike:
                      s3:prefix: 'eventos/*'

    EventosPublicosLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-eventos-publicos-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        Policies:
          # Mínimo privilegio (CLAUDE.md §5, A05): solo dynamodb:Query sobre
          # agora-eventos (tabla + GSIs, el sufijo /index/* es obligatorio o
          # Query sobre un GSI falla con AccessDenied) — sin Scan, sin
          # acceso a agora-usuarios, sin s3:* (las URLs de imagen se
          # calculan por convención de nombre, no requieren permiso S3: son
          # públicas por bucket policy, no prefirmadas).
          - PolicyName: agora-eventos-publicos-dynamodb-${sls:stage}
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - dynamodb:Query
                  Resource:
                    - !GetAtt AgoraEventos.Arn
                    - !Sub '${AgoraEventos.Arn}/index/*'

    SsrLambdaRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: agora-ssr-role-${sls:stage}
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        ManagedPolicyArns:
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        # Sin política de DynamoDB: el SSR solo renderiza, no lee datos.

    # --- Tablas DynamoDB (tech-specs.md §5.2) ---
    # Todas PAY_PER_REQUEST, sin excepción, sin ProvisionedThroughput en
    # tabla ni GSI — regla de mayor prioridad de CLAUDE.md (sección "Costos
    # de infraestructura"), derivada del incidente real de Babel
    # (docs/advertencia-urgente-costos-aws.md: US$90,34 en un mes por
    # capacidad PROVISIONED olvidada, con las tablas de producción vacías).
    AgoraUsuarios:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.usuarios}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: email
            KeyType: HASH

    AgoraEventos:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.eventos}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: eventoId
            AttributeType: S
          - AttributeName: slug
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: fechaHora
            AttributeType: S
        KeySchema:
          - AttributeName: eventoId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: slug-index
            KeySchema:
              - AttributeName: slug
                KeyType: HASH
            Projection:
              ProjectionType: ALL
            # Sin ProvisionedThroughput: en PAY_PER_REQUEST el GSI hereda el
            # modo de la tabla; declararlo aquí hace fallar el despliegue.
          - IndexName: estado-fechaHora-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
              - AttributeName: fechaHora
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    AgoraCompras:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.compras}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: compraId
            AttributeType: S
          - AttributeName: eventoId
            AttributeType: S
          - AttributeName: creadaEn
            AttributeType: S
          - AttributeName: tokenAprobacionHash
            AttributeType: S
        KeySchema:
          - AttributeName: compraId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: eventoId-creadaEn-index
            KeySchema:
              - AttributeName: eventoId
                KeyType: HASH
              - AttributeName: creadaEn
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: tokenAprobacionHash-index
            KeySchema:
              - AttributeName: tokenAprobacionHash
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        # TTL: el reloj de limpieza y devolución de aforo, NO el reloj de
        # negocio — toda lectura debe tratar como expirada una reserva con
        # expiraEn pasado, exista o no todavía el ítem (tech-specs.md §5.4
        # punto 4, MEMORY.md §7).
        TimeToLiveSpecification:
          AttributeName: expiraEn
          Enabled: true
        # Streams: consumidos por la futura Lambda `liberarReservas`
        # (tech-specs.md §5.3, roadmap #8) para devolver el aforo cuando el
        # TTL borra una reserva vencida. NEW_AND_OLD_IMAGES porque el evento
        # de borrado por TTL necesita la imagen anterior para saber cuántas
        # sillas devolver.
        StreamSpecification:
          StreamViewType: NEW_AND_OLD_IMAGES

    AgoraBoletas:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.boletas}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: boletaId
            AttributeType: S
          - AttributeName: eventoId
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
          - AttributeName: compraId
            AttributeType: S
        KeySchema:
          - AttributeName: boletaId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: eventoId-estado-index
            KeySchema:
              - AttributeName: eventoId
                KeyType: HASH
              - AttributeName: estado
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: compraId-index
            KeySchema:
              - AttributeName: compraId
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    AgoraAuditoria:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:custom.nombresTablas.auditoria}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: entidadId
            AttributeType: S
          - AttributeName: ocurridoEn
            AttributeType: S
        KeySchema:
          - AttributeName: entidadId
            KeyType: HASH
          - AttributeName: ocurridoEn
            KeyType: RANGE
        # Append-only (CLAUDE.md §5, A09): ningún código actualiza ni borra
        # ítems de esta tabla, nunca al corregir un error.

    # --- Buckets S3 (tech-specs.md §5, §7.1; CLAUDE.md §5 A02) ---
    BucketComprobantes:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.nombresBuckets.comprobantes}
        # Comprobantes de pago: documentos financieros de terceros. Block
        # Public Access sin excepción — se sirven solo por URL prefirmada
        # de vida corta generada por la Lambda (CLAUDE.md §5, A02).
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    BucketActivos:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.nombresBuckets.activos}
        # Imágenes de evento y QR: en el diseño final se sirven "vía CDN"
        # (tech-specs.md §1), pero el CDN (CloudFront + dominio propio)
        # todavía no existe (roadmap #17). Excepción deliberada tomada para
        # la Tarea 1 (Cartelera pública): BlockPublicPolicy/RestrictPublicBuckets
        # en false para permitir la BucketPolicy pública de abajo, acotada
        # solo al prefijo `eventos/*` — las imágenes de evento necesitan una
        # URL estable (no una prefirmada de 15 minutos) para servir como
        # `og:image` y sobrevivir a la vista previa cacheada por WhatsApp.
        # BlockPublicAcls/IgnorePublicAcls siguen en true: seguimos sin usar
        # ACLs, solo una bucket policy. El resto del bucket (comprobantes no
        # viven aquí, pero cualquier otro prefijo futuro) sigue privado por
        # defecto. Esto se revisará cuando exista CloudFront/OAC (roadmap #17).
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: false
          IgnorePublicAcls: true
          RestrictPublicBuckets: false
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        # Sin esto, la subida directa del navegador con la URL prefirmada
        # (server/api/handlers/eventos.ts, generarUrlCargaActivo) falla en
        # el preflight (OPTIONS) del propio navegador antes de llegar a S3
        # — bug real encontrado en staging (MEMORY.md §7): cualquier imagen
        # fallaba al subir, sin relación con su tamaño o formato.
        # `AllowedOrigins: '*'` es aceptable aquí porque CORS solo controla
        # qué origen puede *leer la respuesta* de la petición desde el
        # navegador; la autorización real de la escritura la da la firma de
        # la URL prefirmada (de vida corta, ligada a una key exacta), no el
        # origen — mismo motivo por el que no hace falta acotarlo a un
        # dominio fijo que además cambiaría con cada stage.
        CorsConfiguration:
          CorsRules:
            - AllowedMethods: [PUT]
              AllowedOrigins: ['*']
              AllowedHeaders: ['*']
              MaxAge: 3000

    # Excepción deliberada tomada para la Tarea 1 (Cartelera pública),
    # distinta del resto de BucketActivos que sigue privado: lectura pública
    # de solo lectura (s3:GetObject) acotada estrictamente al prefijo
    # `eventos/*`, para que imagenUrl/logotipoUrl (calculadas en
    # eventos-publicos.ts) sirvan como og:image con una URL estable — no una
    # prefirmada de 15 minutos, que rompería la vista previa cacheada por
    # WhatsApp. Se revisará cuando exista CloudFront/OAC (roadmap #17).
    BucketActivosPolicyPublica:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref BucketActivos
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub '${BucketActivos.Arn}/eventos/*'

  Outputs:
    # Fuente confiable de la URL del endpoint para el smoke test de CI
    # (.github/workflows/deploy.yml) — evita parsear el texto de salida de
    # `serverless deploy`, que en Serverless Framework 4 no siempre llega
    # por stdout (gotcha real: el primer despliegue de esta infraestructura
    # rompió el smoke test porque el paso de CI solo capturaba stdout con
    # `tee`, y el resumen de endpoints salió por stderr — MEMORY.md §7).
    HttpApiUrl:
      Description: URL base del endpoint de API Gateway (HTTP API)
      # Fn::Join en vez de !Sub: el resolvedor de variables ${...} de
      # Serverless Framework intenta resolver ${HttpApi}/${AWS::Region}
      # ANTES de que CloudFormation vea el Fn::Sub, y el resultado quedó
      # como un Value con Fn::Join y Fn::Sub mezclados en el mismo mapa —
      # inválido para CloudFormation ("must evaluate to a String and not
      # a Map"), y rompió el primer despliegue real de este Output
      # (MEMORY.md §7). Fn::Join con !Ref no contiene ningún `${...}`, así
      # que el resolvedor de Serverless no lo toca.
      #
      # AWS::URLSuffix explícito, no el literal '.amazonaws.com': Serverless
      # Framework reescribe automáticamente cualquier Fn::Join que reconoce
      # como URL de API Gateway para usar el pseudo-parámetro dinámico, y
      # si ya hay un '.amazonaws.com' literal en la lista, el suyo se
      # AGREGA en vez de reemplazarlo — el segundo intento de este Output
      # produjo 'amazonaws.comamazonaws.com' duplicado. Referenciarlo aquí
      # explícitamente evita que Serverless "corrija" nada.
      Value:
        Fn::Join:
          - ''
          - - 'https://'
            - !Ref HttpApi
            - '.execute-api.'
            - !Ref 'AWS::Region'
            - '.'
            - !Ref 'AWS::URLSuffix'
