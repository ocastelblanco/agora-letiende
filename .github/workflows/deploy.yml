name: Build, test y despliegue

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  NODE_VERSION: '24'

jobs:
  build-y-test:
    name: Build + test (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Build de producción del frontend Angular (SSR)
        run: npm run build -- --configuration=production

      - name: Build de TypeScript de las Lambdas
        run: npm run build:api

      - name: Empaqueta con esbuild las Lambdas que lo necesitan (usuariosMe)
        run: npm run bundle:api

      - name: Pruebas unitarias (frontend)
        run: npm test -- --watch=false

      - name: Pruebas unitarias (backend)
        run: npm run test:api

      - name: Verificar sintaxis de infraestructura (serverless package)
        run: npx serverless package --stage staging
        env:
          # License Key de Serverless Framework v4 (sin depender del
          # dashboard), necesaria para que la CLI opere en CI sin login
          # interactivo (tech-specs.md §9).
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  desplegar-staging:
    name: Deploy a staging
    if: github.event_name == 'pull_request'
    needs: build-y-test
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      # Un solo despliegue de staging a la vez: si hay pushes seguidos al
      # mismo PR (o PRs distintos abiertos en paralelo), solo el más
      # reciente termina desplegado — evita que dos runs se pisen entre sí
      # sobre el mismo stack compartido de staging (MEMORY.md §7, gotcha
      # heredado de Babel).
      group: desplegar-staging
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Build de producción del frontend Angular (SSR)
        run: npm run build -- --configuration=production

      - name: Build de TypeScript de las Lambdas
        run: npm run build:api

      - name: Empaqueta con esbuild las Lambdas que lo necesitan (usuariosMe)
        run: npm run bundle:api

      - name: Desplegar con Serverless Framework (stage staging)
        id: deploy
        run: |
          npx serverless deploy --stage staging
          # Se lee el endpoint del Output de CloudFormation (serverless.yml
          # resources.Outputs.HttpApiUrl), no del texto de salida de
          # `serverless deploy`: en Serverless Framework 4 ese resumen no
          # siempre llega por stdout, y parsearlo con `tee`/grep dejó el
          # smoke test sin URL en el primer despliegue real de esta
          # infraestructura (MEMORY.md §7).
          endpoint=$(aws cloudformation describe-stacks \
            --stack-name agora-letiende-staging \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
            --output text)
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
        env:
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Sin esto, `${env:FIREBASE_SERVICE_ACCOUNT_AGORA, ''}` en
          # serverless.yml resuelve a cadena vacía y la Lambda `usuariosMe`
          # despliega sin credencial real: verifyIdToken nunca llega a
          # ejecutarse, GET /api/usuarios/me responde 500 en vez de 200/403
          # (verificado en vivo en staging — MEMORY.md §7).
          FIREBASE_SERVICE_ACCOUNT_AGORA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGORA }}
          # Mismo gotcha que FIREBASE_SERVICE_ACCOUNT_AGORA arriba, esta vez
          # con las Lambdas compras/comprobantes (TODO.md Tarea 2): sin
          # estas tres variables, `correo-ses.ts` intenta enviar con
          # `Source: ''`, SES lo rechaza, y el `catch` best-effort de
          # `compras.ts`/`comprobantes.ts` lo traga en silencio — el enlace
          # de comprobante nunca llega, sin ningún error visible
          # (encontrado en vivo en staging el 08/08/2026, MEMORY.md §7).
          SES_REMITENTE: ${{ secrets.SES_REMITENTE }}
          URL_BASE_APP: ${{ secrets.URL_BASE_APP }}
          SECRETO_ENLACES_MAGICOS: ${{ secrets.SECRETO_ENLACES_MAGICOS }}
          # Mismo gotcha, esta vez con las Lambdas aprobaciones/boletas
          # (TODO.md Tarea 2, Emisión de boletas): sin esto, las firmas de
          # boleta se calculan igual pero con una llave vacía y predecible,
          # falsificable sin acceso al sistema (CLAUDE.md §5, A02) — a
          # diferencia de SES_REMITENTE, este fallo no rompe nada visible.
          SECRETO_FIRMA_BOLETAS: ${{ secrets.SECRETO_FIRMA_BOLETAS }}
          # Mismo gotcha, esta vez con la Lambda eventos (roadmap #22,
          # Sincronización con Google Calendar): sin esto, la sincronización
          # se salta en silencio (best-effort por diseño) — el evento se
          # crea/edita bien en Ágora, pero nunca aparece en Calendar, sin
          # ningún error visible (encontrado en vivo en staging, MEMORY.md §7).
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT }}
          # Mismo gotcha, esta vez con las Lambdas compras/boldWebhook
          # (roadmap #19, Sub-tarea 1, Bold): sin BOLD_LLAVE_SECRETA, la
          # firma del botón se calcula igual pero con una llave vacía y
          # predecible (falsificable sin acceso al sistema, CLAUDE.md §5,
          # A02) y la verificación del webhook rechaza toda firma real de
          # producción. Sin BOLD_LLAVE_IDENTIDAD, compras.ts le devuelve al
          # frontend una llave de identidad vacía y el botón de Bold nunca
          # renderiza (Sub-tarea 2). Checklist obligatorio de este proyecto,
          # verificado por CLI tras el despliegue (CLAUDE.md, protocolo de
          # git): confirmar con `aws lambda get-function-configuration` que
          # la Lambda real trae el valor real, no la cadena vacía por
          # defecto de `${env:..., ''}`.
          BOLD_LLAVE_SECRETA: ${{ secrets.BOLD_LLAVE_SECRETA }}
          BOLD_LLAVE_IDENTIDAD: ${{ secrets.BOLD_LLAVE_IDENTIDAD }}

      - name: Smoke test contra staging recién desplegado
        run: |
          url="${{ steps.deploy.outputs.endpoint }}/api/salud"
          codigo=$(curl -sS -o /tmp/salud.json -w '%{http_code}' "$url")
          echo "GET $url → HTTP $codigo"
          cat /tmp/salud.json
          test "$codigo" = "200"

      - name: Comentar la URL de staging en el PR
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "🚀 Desplegado a **staging**: ${{ steps.deploy.outputs.endpoint }}"
        env:
          GH_TOKEN: ${{ github.token }}

  desplegar-produccion:
    name: Deploy a producción
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      # Mismo motivo que el grupo `desplegar-staging`: si varios PRs se
      # fusionan a `main` en sucesión rápida, cada merge dispara su propio
      # deploy a producción — sin este grupo, dos runs pueden chocar contra
      # el mismo stack de CloudFormation en `UPDATE_IN_PROGRESS`
      # (MEMORY.md §7, gotcha heredado de Babel). `cancel-in-progress: false`
      # (a diferencia de staging): el run en curso termina en vez de
      # cancelarse a mitad de un `serverless deploy`.
      group: desplegar-produccion
      cancel-in-progress: false
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci

      - name: Build de producción del frontend Angular (SSR)
        run: npm run build -- --configuration=production

      - name: Build de TypeScript de las Lambdas
        run: npm run build:api

      - name: Empaqueta con esbuild las Lambdas que lo necesitan (usuariosMe)
        run: npm run bundle:api

      - name: Desplegar con Serverless Framework (stage production)
        run: npx serverless deploy --stage production
        env:
          SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          FIREBASE_SERVICE_ACCOUNT_AGORA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_AGORA }}
          # Mismo motivo que en desplegar-staging arriba.
          SES_REMITENTE: ${{ secrets.SES_REMITENTE }}
          URL_BASE_APP: ${{ secrets.URL_BASE_APP }}
          SECRETO_ENLACES_MAGICOS: ${{ secrets.SECRETO_ENLACES_MAGICOS }}
          SECRETO_FIRMA_BOLETAS: ${{ secrets.SECRETO_FIRMA_BOLETAS }}
          GOOGLE_CALENDAR_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_CALENDAR_SERVICE_ACCOUNT }}
          # Mismo motivo que en desplegar-staging arriba. BOLD_MODO_PRUEBAS
          # no viaja por aquí: es un literal 'true'/'false' resuelto por
          # stage directamente en serverless.yml (Fn::If EsProduccion), no
          # un secreto — no es sensible.
          BOLD_LLAVE_SECRETA: ${{ secrets.BOLD_LLAVE_SECRETA }}
          BOLD_LLAVE_IDENTIDAD: ${{ secrets.BOLD_LLAVE_IDENTIDAD }}
