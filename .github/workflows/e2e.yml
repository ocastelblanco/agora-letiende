name: Pruebas E2E (Playwright)

# Roadmap #30, ADR-015. Workflow aparte de deploy.yml a propósito: aquél despliega
# a staging/producción con sus propias reglas de concurrencia, y las pruebas E2E
# no deben alargar ni bloquear ese despliegue.
#
# Dos suites que no se mezclan:
# - `simulado` (en cada PR): API y Bold simulados, hermética, sin secretos ni AWS.
# - `staging` (a mano, `workflow_dispatch`): flujo real contra staging con el checkout
#   sandbox de Bold, un evento temporal sembrado y borrado en DynamoDB y el webhook
#   real. Nunca bloquea un PR (ADR-015). Se lanza desde la pestaña Actions →
#   "Pruebas E2E (Playwright)" → Run workflow.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  simulado:
    name: Suite simulada (escritorio, Android, iOS)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Imagen oficial de Playwright con navegadores y librerías del sistema ya instalados.
      # DEBE coincidir con la versión de `@playwright/test` (la guarda de abajo falla con un
      # mensaje claro si no; el contexto `env` no existe en `container`, por eso va literal en cada job).
      # Reemplaza `playwright install --with-deps`, que bajaba decenas de paquetes con apt de
      # un espejo de Ubuntu que un día fue lentísimo y agotó los 20 minutos del job sin correr
      # una sola prueba (01/10/2026, PR #89).
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci
        timeout-minutes: 5

      - name: Verificar que la imagen trae los navegadores de esta versión de Playwright
        run: |
          node -e "
            const fs = require('fs');
            const pw = require('@playwright/test');
            const faltan = [pw.chromium, pw.webkit].filter((n) => !fs.existsSync(n.executablePath())).map((n) => n.name());
            if (faltan.length) {
              console.error('::error::La imagen no trae ' + faltan.join(', ') + ' para @playwright/test ' + require('@playwright/test/package.json').version + ': actualiza la imagen en los dos jobs de e2e.yml');
              process.exit(1);
            }
          "

      - name: Pruebas E2E simuladas
        run: npm run e2e
        timeout-minutes: 10
        env:
          CI: 'true'

      - name: Subir reporte HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright
          path: playwright-report/
          retention-days: 14

      - name: Subir trazas, videos y capturas de las pruebas que fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-playwright
          path: test-results/
          retention-days: 14

  staging:
    name: Suite real contra staging (checkout sandbox de Bold)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Imagen oficial de Playwright con navegadores y librerías del sistema ya instalados.
      # DEBE coincidir con la versión de `@playwright/test` (la guarda de abajo falla con un
      # mensaje claro si no; el contexto `env` no existe en `container`, por eso va literal en cada job).
      # Reemplaza `playwright install --with-deps`, que bajaba decenas de paquetes con apt de
      # un espejo de Ubuntu que un día fue lentísimo y agotó los 20 minutos del job sin correr
      # una sola prueba (01/10/2026, PR #89).
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    # Los secretos del usuario IAM de CI viven en el environment `staging` (no son globales).
    environment: staging
    concurrency:
      # Una sola corrida real a la vez: comparten la configuración del webhook del sandbox de Bold.
      group: e2e-staging
      cancel-in-progress: false
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias (reproducible, package-lock.json)
        run: npm ci
        timeout-minutes: 5

      - name: Verificar que la imagen trae los navegadores de esta versión de Playwright
        run: |
          node -e "
            const fs = require('fs');
            const pw = require('@playwright/test');
            const faltan = [pw.chromium, pw.webkit].filter((n) => !fs.existsSync(n.executablePath())).map((n) => n.name());
            if (faltan.length) {
              console.error('::error::La imagen no trae ' + faltan.join(', ') + ' para @playwright/test ' + require('@playwright/test/package.json').version + ': actualiza la imagen en los dos jobs de e2e.yml');
              process.exit(1);
            }
          "

      - name: Pruebas E2E reales contra staging
        run: npm run e2e:staging
        timeout-minutes: 10
        env:
          CI: 'true'
          # Usuario IAM propio de las pruebas: solo las tablas agora-eventos/compras/boletas de
          # staging (`docs/tareas-a-realizar.md`). Nunca las credenciales de despliegue.
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: us-east-1

      - name: Subir reporte HTML de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-staging
          path: playwright-report/
          retention-days: 14

      - name: Subir trazas, videos y capturas de las pruebas que fallaron
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-playwright-staging
          path: test-results/
          retention-days: 14

